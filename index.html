<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timtam</title>
    <!-- Load the Model Viewer script -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- The AR element -->
    <model-viewer 
        src="model.glb" 
        ios-src="model.usdz"
        ar 
        ar-modes="quick-look webxr scene-viewer"
        camera-controls 
        tone-mapping="neutral" 
        poster="loading.png" 
        shadow-intensity="1">
        
        <button slot="ar-button" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
            View in your space
        </button>
    </model-viewer>
</body>
</html>
